spring.config.activate.on-profile=deploy

# Deployment profile expects infrastructure details to be provided externally.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

wireshark.tsharkPath=${WIRESHARK_TSHARK_PATH}
wireshark.text2pcapPath=${WIRESHARK_TEXT2PCAP_PATH:}
wireshark.cfgRoot=${WIRESHARK_CFG_ROOT:runtime/wireshark_cfg}
wireshark.configDir=${WIRESHARK_CONFIG_DIR:}
wireshark.useIsolatedConfig=${WIRESHARK_USE_ISOLATED_CONFIG:true}
wireshark.profileName=${WIRESHARK_PROFILE_NAME:rrc_decode}
wireshark.enableTlsDecryption=${WIRESHARK_ENABLE_TLS_DECRYPTION:false}
wireshark.verifyOnStartup=${WIRESHARK_VERIFY_ON_STARTUP:true}
wireshark.failFastOnInvalidToolchain=${WIRESHARK_FAIL_FAST_ON_INVALID_TOOLCHAIN:true}

decrypt.gateway.url=${DECRYPT_GATEWAY_URL}
