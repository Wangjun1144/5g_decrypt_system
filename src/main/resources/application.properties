spring.application.name=5g-decrypt-system

# Redis defaults are safe for local single-node development and can be overridden
# by environment variables in test or deployment environments.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

# Capture-build migration controls. Stage 2 prefers the native Java pcap writer
# while still allowing fallback or forced external execution when needed.
decode.capture-build.mode=${DECODE_CAPTURE_BUILD_MODE:native}
decode.capture-build.fallback-to-external=${DECODE_CAPTURE_BUILD_FALLBACK_TO_EXTERNAL:true}

# Base Wireshark integration defaults. Executable paths are intentionally left
# blank here so the base profile stays portable across machines.
wireshark.tsharkPath=${WIRESHARK_TSHARK_PATH:}
wireshark.text2pcapPath=${WIRESHARK_TEXT2PCAP_PATH:}
wireshark.cfgRoot=${WIRESHARK_CFG_ROOT:runtime/wireshark_cfg}
wireshark.configDir=${WIRESHARK_CONFIG_DIR:}
wireshark.useIsolatedConfig=${WIRESHARK_USE_ISOLATED_CONFIG:true}
wireshark.profileName=${WIRESHARK_PROFILE_NAME:rrc_decode}
wireshark.enableTlsDecryption=${WIRESHARK_ENABLE_TLS_DECRYPTION:false}
wireshark.verifyOnStartup=${WIRESHARK_VERIFY_ON_STARTUP:true}
wireshark.failFastOnInvalidToolchain=${WIRESHARK_FAIL_FAST_ON_INVALID_TOOLCHAIN:false}

# DLT to dissector mapping used to generate user_dlts for tshark decoding.
wireshark.userDlts.147=nr-rrc.ul.dcch
wireshark.userDlts.148=nr-rrc.dl.dcch
wireshark.userDlts.149=udp
wireshark.userDlts.150=nr-rrc.dl.ccch
wireshark.userDlts.151=nas-5gs
wireshark.userDlts.152=ngap
wireshark.userDlts.153=nr-rrc.ul.ccch

decrypt.gateway.url=${DECRYPT_GATEWAY_URL:http://127.0.0.1:8004/decrypt}
