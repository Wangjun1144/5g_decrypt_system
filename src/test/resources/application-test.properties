spring.config.activate.on-profile=test

# Test profile keeps integration tests runnable on the current workstation while
# still allowing CI or other machines to override everything via env vars.
spring.data.redis.host=${TEST_REDIS_HOST:${REDIS_HOST:192.168.179.132}}
spring.data.redis.port=${TEST_REDIS_PORT:${REDIS_PORT:6379}}

wireshark.tsharkPath=${TEST_WIRESHARK_TSHARK_PATH:${WIRESHARK_TSHARK_PATH:D:/wireshark/tshark.exe}}
wireshark.text2pcapPath=${TEST_WIRESHARK_TEXT2PCAP_PATH:${WIRESHARK_TEXT2PCAP_PATH:D:/wireshark/text2pcap.exe}}
wireshark.cfgRoot=${TEST_WIRESHARK_CFG_ROOT:${WIRESHARK_CFG_ROOT:runtime/wireshark_cfg}}
wireshark.configDir=${TEST_WIRESHARK_CONFIG_DIR:${WIRESHARK_CONFIG_DIR:${user.home}/AppData/Roaming/Wireshark}}
wireshark.useIsolatedConfig=${TEST_WIRESHARK_USE_ISOLATED_CONFIG:${WIRESHARK_USE_ISOLATED_CONFIG:true}}
wireshark.profileName=${TEST_WIRESHARK_PROFILE_NAME:${WIRESHARK_PROFILE_NAME:rrc_decode}}
wireshark.enableTlsDecryption=${TEST_WIRESHARK_ENABLE_TLS_DECRYPTION:${WIRESHARK_ENABLE_TLS_DECRYPTION:false}}
wireshark.verifyOnStartup=${TEST_WIRESHARK_VERIFY_ON_STARTUP:${WIRESHARK_VERIFY_ON_STARTUP:true}}
wireshark.failFastOnInvalidToolchain=${TEST_WIRESHARK_FAIL_FAST_ON_INVALID_TOOLCHAIN:${WIRESHARK_FAIL_FAST_ON_INVALID_TOOLCHAIN:false}}

decrypt.gateway.url=${TEST_DECRYPT_GATEWAY_URL:${DECRYPT_GATEWAY_URL:http://127.0.0.1:8004/decrypt}}
